<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
 <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
 <title>تسجيل الدخول - حيّك</title>
 <style>
    /* منع خروج العناصر عن حجمها الطبيعي */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #219653;
      --accent: #ff6b00;
      --dark: #1a1a1a;
      --light: #ffffff;
      --gray-bg: #f8f9fa;
    }

    body {
      font-family: 'Tajawal', sans-serif;
      background: var(--gray-bg);
      min-height: 100vh;
      display: flex;
    }

    /* الحاوية الرئيسية المنقسمة لشاشتين */
    .login-container {
      display: flex;
      width: 100%;
      min-height: 100vh;
    }

    /* الجانب الأول: نموذج تسجيل الدخول */
    .form-side {
      flex: 1;
      background: var(--light);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
    }

    .wrapper h1 {
      color: var(--dark);
      font-weight: 900;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }

    .wrapper .subtitle {
      color: #666;
      margin-bottom: 2.5rem;
      font-size: 0.95rem;
    }

    .input-box {
      position: relative;
      margin-bottom: 1.5rem;
    }

    .input-box input {
      width: 100%;
      padding: 0.9rem 2.8rem 0.9rem 1rem;
      font-size: 1rem;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-family: 'Tajawal', sans-serif;
      outline: none;
      background: #fafafa;
      transition: all 0.3s ease;
    }

    .input-box input:focus {
      border-color: var(--primary);
      background: var(--light);
      box-shadow: 0 0 0 4px rgba(33, 150, 83, 0.1);
    }

    .input-box i {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      transition: color 0.3s ease;
    }

    .input-box input:focus + i {
      color: var(--primary);
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      margin-bottom: 2rem;
      color: #555;
    }

    .remember-forgot label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
    }

    .remember-forgot input[type="checkbox"] {
      accent-color: var(--primary);
      cursor: pointer;
    }

    .remember-forgot a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 700;
    }
    
    .remember-forgot a:hover {
      text-decoration: underline;
    }

    .btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      font-family: 'Tajawal', sans-serif;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(33, 150, 83, 0.2);
    }

    .btn:hover {
      background: #1e8449;
      transform: translateY(-1px);
      box-shadow: 0 6px 15px rgba(33, 150, 83, 0.3);
    }

    .register-link {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.95rem;
      color: #666;
    }

    .register-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: bold;
    }
    
    .register-link a:hover {
      text-decoration: underline;
    }

    /* الجانب المقابل: صورة  مع نصوص الواجهة العميقة */
    .image-side {
      flex: 1.2; 
      background: linear-gradient(135deg, rgba(26, 26, 26, 0.6) 0%, rgba(33, 150, 83, 0.4) 100%), 
                  url('pic4.jpg') center/cover no-repeat;
      display: flex;
      align-items: flex-end;
      padding: 4rem;
      position: relative;
    }

    
    .image-content {
      color: var(--light);
      max-width: 500px;
      z-index: 2;
    }

    .image-content h2 {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 1rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .image-content p {
      font-size: 1.1rem;
      line-height: 1.7;
      opacity: 0.95;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

   
    @media (max-width: 900px) {
      .image-side {
        display: none; 
      }
      .form-side {
        background: var(--gray-bg);
      }
      .wrapper {
        background: var(--light);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
      }
    }
 </style>
</head>
<body>

   <div class="login-container">
      
      <div class="form-side">
         <div class="wrapper">
            <form action="index.html">
               <h1>مرحباً بك في حيّك</h1>
               <p class="subtitle">سجل دخولك لاستكشاف وتصفح الأحياء السكنية</p>
               
               <div class="input-box">
                 <input type="text" placeholder="اسم المستخدم" required>
                 <i class="fas fa-user"></i>
               </div>
               
               <div class="input-box">
                 <input type="password" placeholder="كلمة المرور" required>
                 <i class="fas fa-lock"></i>
               </div>
               
               <div class="remember-forgot">
                 <label><input type="checkbox"> تذكرني</label> 
                 <a href="#">نسيت كلمة المرور؟</a>
               </div>
               
               <button type="submit" class="btn">دخول</button>

               <div class="register-link">
                 <p>ليس لديك حساب؟ <a href="#">تسجيل جديد</a></p>
               </div>
            </form>
         </div>
      </div>

      <div class="image-side">
         <div class="image-content">
            <h2>اكتشف مجتمعك المثالي</h2>
            <p>أكثر من مجرد مسكن.. نأخذك في جولة حية بداخل أرقى الأحياء السكنية لتجد البيئة المتكاملة التي تلبي تطلعاتك وتناسب أسلوب حياتك.</p>
         </div>
      </div>

   </div>

</body>
</html>
