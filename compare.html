<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>مقارنة الأحياء - حيّك</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #219653;
      --secondary: #f9f9f9;
      --text: #333;
      --accent: #ff6b00;
      --dark: #1a1a1a;
      --light: #ffffff;
      --shadow: rgba(0, 0, 0, 0.1);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Tajawal', sans-serif; background: var(--secondary); color: var(--text); }
    
    /* ضبط وتثبيت شريط التنقل */
    .navbar { 
      background: var(--dark); 
      padding: 1.2rem 5%; 
      position: sticky; 
      top: 0; 
      z-index: 1000; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      box-shadow: 0 2px 8px var(--shadow); 
    }
    .navbar .logo { 
      color: var(--accent) !important; 
      font-size: 1.8rem; 
      font-weight: 900; 
      text-decoration: none; 
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .navbar .logo i {
      font-size: 1.5rem;
      color: var(--accent) !important; /* اللون البرتقالي الموحد للأيقونة */
    }
    .nav-links { display: flex; gap: 1.5rem; align-items: center; }
    .nav-item, .nav-dropdown-btn { color: white; background: none; border: none; font-weight: bold; cursor: pointer; text-decoration: none; font-size: 1rem; transition: color 0.3s ease; }
    .nav-item:hover, .nav-dropdown-btn:hover { color: var(--accent); }
    .nav-dropdown { position: relative; }
    .dropdown-content { display: none; position: absolute; top: 100%; right: 0; background: var(--light); min-width: 180px; border-radius: 6px; box-shadow: 0 6px 12px var(--shadow); overflow: hidden; z-index: 100; }
    .nav-dropdown:hover .dropdown-content { display: block; }
    .dropdown-content a { display: block; padding: 1rem; text-decoration: none; color: var(--text); text-align: right; }
    .dropdown-content a:hover { background: var(--primary); color: white; }

    .comparison-container { padding: 3rem 2rem; max-width: 1200px; margin: auto; }
    .comparison-header { text-align: center; margin-bottom: 3rem; }
    .comparison-header h1 { color: var(--primary); font-size: 2.5rem; }
    .selectors { display: flex; justify-content: center; gap: 2rem; margin-top: 1.5rem; }
    .neighborhood-select { padding: 0.8rem 2rem; font-size: 1.1rem; border-radius: 8px; border: 2px solid var(--primary); font-family: 'Tajawal', sans-serif; cursor: pointer; }
    
    .comparison-section { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 10px var(--shadow); margin-bottom: 2.5rem; }
    .comparison-section h2 { color: var(--accent); margin-bottom: 1.5rem; border-bottom: 2px solid var(--secondary); padding-bottom: 0.5rem; }
    
    .compare-table { width: 100%; border-collapse: collapse; text-align: right; }
    .compare-table th, .compare-table td { padding: 1rem; border-bottom: 1px solid var(--secondary); }
    .compare-table th { background: var(--secondary); color: var(--dark); font-weight: bold; }
    
    /* Progress Bars Styling */
    .progress-cell { display: flex; align-items: center; gap: 1rem; }
    .progress-value { font-weight: bold; min-width: 45px; }
    .progress-bar { background: #e0e0e0; border-radius: 10px; height: 12px; width: 100%; overflow: hidden; }
    .progress { background: var(--primary); height: 100%; border-radius: 10px; transition: width 0.5s ease; }
    
    /* Service Cards Grid */
    .service-card { background: var(--secondary); padding: 1.5rem; border-radius: 8px; border-right: 5px solid var(--accent); box-shadow: 0 2px 5px var(--shadow); }
    .service-card h3 { margin-top: 0; color: var(--dark); }
    .service-card p { margin: 0.5rem 0; font-size: 0.95rem; color: #555; }
    .stat-value { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo">
      <i class="fas fa-house-user"></i> حيّك
    </a>
    <div class="nav-links">
      <a href="map.html" class="nav-item">الخريطة</a>
    </div>
  </nav>

  <main class="comparison-container">
    <div class="comparison-header">
      <h1>مقارنة بين الأحياء</h1>
      <div class="selectors">
        <select id="firstNeighborhood" class="neighborhood-select">
          <option value="">اختر الحي الأول</option>
          <option value="1">الشفا</option>
          <option value="2">الرمال</option>
          <option value="3">الياسمين</option>
          <option value="4">النرجس</option>
        </select>
        <select id="secondNeighborhood" class="neighborhood-select">
          <option value="">اختر الحي الثاني</option>
          <option value="1">الشفا</option>
          <option value="2">الرمال</option>
          <option value="3">الياسمين</option>
          <option value="4">النرجس</option>
        </select>
      </div>
    </div>

    <div class="comparison-content">
      <section class="comparison-section">
        <h2><i class="fas fa-info-circle"></i> المعلومات العامة</h2>
        <table class="compare-table" id="generalInfoTable">
          <thead>
            <tr>
              <th>البيان</th>
              <th id="firstNeighborhoodHeader">الحي الأول</th>
              <th id="secondNeighborhoodHeader">الحي الثاني</th>
            </tr>
          </thead>
          <tbody id="generalInfoBody">
            <tr><td colspan="3" style="text-align:center; color:#999;">يرجى اختيار الأحياء لبدء المقارنة</td></tr>
          </tbody>
        </table>
      </section>

      <section class="comparison-section">
        <h2><i class="fas fa-building"></i> المرافق</h2>
        <table class="compare-table" id="facilitiesTable">
          <thead>
            <tr>
              <th>نوع المرفق</th>
              <th id="facilitiesFirstHeader">الحي الأول</th>
              <th id="facilitiesSecondHeader">الحي الثاني</th>
            </tr>
          </thead>
          <tbody id="facilitiesBody"></tbody>
        </table>
      </section>

      <section class="comparison-section">
        <h2><i class="fas fa-chart-bar"></i> المقاييس</h2>
        <table class="compare-table" id="metricsTable">
          <thead>
            <tr>
              <th>المقياس</th>
              <th id="metricsFirstHeader">الحي الأول</th>
              <th id="metricsSecondHeader">الحي الثاني</th>
            </tr>
          </thead>
          <tbody id="metricsBody"></tbody>
        </table>
      </section>

      <section class="comparison-section">
        <h2><i class="fas fa-concierge-bell"></i> الخدمات</h2>
        <table class="compare-table" id="servicesTable">
          <thead>
            <tr>
              <th>الخدمة</th>
              <th id="servicesFirstHeader">الحي الأول</th>
              <th id="servicesSecondHeader">الحي الثاني</th>
            </tr>
          </thead>
          <tbody id="servicesBody"></tbody>
        </table>
      </section>
    </div>
  </main>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
